<div #selectContainer class="tedi-select__container">
  <button
    tedi-input
    class="tedi-select__trigger"
    type="button"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleDropdown()"
    [attr.tabindex]="disabled() ? -1 : 0"
    [size]="size()"
    [state]="state()"
  >
    <span
      class="tedi-select__value"
      [class.tedi-select__placeholder]="!value()"
    >
      {{ selectedLabel() }}
    </span>
    @if (value() && !disabled()) {
      <button
        type="button"
        class="tedi-select__clear-btn"
        aria-label="Clear selection"
        (click)="clearSelection($event)"
      >
        <tedi-icon name="close" [size]="16" color="tertiary" />
      </button>
    }
    <!-- TODO: Here should be a icon instead of span? -->
    <span class="tedi-select__arrow"></span>
  </button>

  @if (isOpen()) {
    <!-- Dropdown should be another component? -->
    <div class="tedi-select__dropdown">
      <ul role="listbox" class="tedi-select__options">
        @for (option of options(); track option.value) {
          <li
            role="option"
            class="tedi-select__option"
            [class.tedi-select-option--selected]="value() === option.value"
            [class.tedi-select-option--disabled]="option.disabled"
            [attr.aria-selected]="value() === option.value"
            [attr.aria-disabled]="option.disabled"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </li>
        }
      </ul>
    </div>
  }
</div>
