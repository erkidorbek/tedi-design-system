<button
  tedi-input
  class="tedi-select__trigger"
  type="button"
  [attr.tabindex]="disabled() ? -1 : 0"
  [size]="size()"
  [state]="state()"
  [cdkMenuTriggerFor]="selectMenu"
>
  <span class="tedi-select__value" [class.tedi-select__placeholder]="!value()">
    {{ selectedLabel() }}
  </span>

  @if (value() && !disabled()) {
    <button
      type="button"
      class="tedi-select__clear-btn"
      aria-label="Clear selection"
      (click)="clearSelection($event)"
    >
      <tedi-icon name="close" [size]="16" color="tertiary" />
    </button>
  }

  <tedi-icon
    [name]="isOpen() ? 'arrow_drop_down' : 'arrow_drop_up'"
    color="secondary"
  />
</button>

<ng-template #selectMenu>
  <tedi-dropdown
    [style.width.px]="width()"
    [options]="normalizedOptions()"
    [selectedValue]="value()"
    (optionSelected)="selectOption($event)"
  />
</ng-template>
