<tedi-card spacing="none">
  <tedi-card-content>
    <ul role="listbox" class="tedi-dropdown__list">
      @for (option of options(); track option.value) {
        <li
          role="option"
          cdkMenuItem
          class="tedi-dropdown__option"
          [class.tedi-select-dropdown__option--selected]="isSelected(option)"
          [class.tedi-select-dropdown__option--disabled]="option.disabled"
          [attr.aria-selected]="isSelected(option)"
          [attr.aria-disabled]="option.disabled"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </li>
      }
    </ul>
  </tedi-card-content>
</tedi-card>
