<div #selectContainer class="tedi-select-container">
  <div
    class="tedi-select-trigger"
    role="combobox"
    aria-haspopup="listbox"
    (click)="toggleDropdown()"
    [attr.tabindex]="disabled() ? -1 : 0"
  >
    <span class="tedi-select-value">{{ selectedLabel() }}</span>
    <span class="tedi-select-arrow"></span>
  </div>

  @if (isOpen()) {
    <div class="tedi-select-dropdown">
      <ul role="listbox" class="tedi-select-options">
        @for (option of options(); track option.value) {
          <li
            role="option"
            class="tedi-select-option"
            [class.tedi-select-option--selected]="value() === option.value"
            [class.tedi-select-option--disabled]="option.disabled"
            [attr.aria-selected]="value() === option.value"
            [attr.aria-disabled]="option.disabled"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </li>
        }
      </ul>
    </div>
  }
</div>
